<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Обновление FineCRM</title>
    <!--
      Окно «Доступна новая версия» (Андрей, 27.10.2026: «в окне, где
      перечислены все изменения, не весь текст влезает»).

      Раньше это было системное окно Windows: длинный список изменений
      вытягивал его за край экрана, и кнопки оказывались внизу, куда не
      достать. Здесь список прокручивается, а кнопки всегда на месте.
      Кнопки — ссылки «#answer-<номер>»: программа видит переход внутри
      страницы и узнаёт ответ, своего моста у страницы нет.
    -->
    <style>
      :root { --bg:#0f1117; --panel:#171a22; --ink:#e7eaf2; --soft:#c3c8d4; --muted:#9096a3; --brand:#2f8fe0; --line:#2c303a; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif; cursor: default;
      }
      header { padding: 22px 26px 10px; }
      h1 { margin: 0 0 4px; font-size: 19px; }
      .cur { margin: 0; color: var(--muted); font-size: 13px; }
      .notes {
        flex: 1; min-height: 0; overflow-y: auto; margin: 8px 26px 0; padding: 12px 16px 12px 4px;
        border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      }
      .notes h2 { margin: 4px 0 8px 18px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .notes ul { margin: 0 0 10px; padding-left: 22px; }
      .notes li { margin: 0 0 8px; color: var(--soft); font-size: 13.5px; -webkit-user-select: text; user-select: text; }
      .notes::-webkit-scrollbar { width: 10px; }
      .notes::-webkit-scrollbar-thumb { background: #3a3f4b; border-radius: 99px; border: 2px solid var(--bg); }
      footer { padding: 14px 26px 20px; }
      .hint { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
      .btns { display: flex; gap: 10px; }
      a.btn {
        display: inline-flex; align-items: center; justify-content: center; min-width: 150px; height: 40px; padding: 0 18px;
        border-radius: 11px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); background: #252a35;
      }
      a.btn.main { background: var(--brand); color: #fff; }
      a.btn:hover { filter: brightness(1.12); }
      a.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Доступна новая версия</h1>
      <p class="cur" id="cur"></p>
    </header>
    <div class="notes" id="notes"></div>
    <footer>
      <p class="hint" id="hint"></p>
      <div class="btns" id="btns"></div>
    </footer>
    <script>
      // Данные — в адресе окна (d=JSON): заголовок, текущая версия, что нового, кнопки.
      const d = JSON.parse(new URLSearchParams(location.search).get("d") || "{}");
      document.getElementById("title").textContent = d.title || "Доступна новая версия";
      document.title = d.title || document.title;
      document.getElementById("cur").textContent = d.current ? "Сейчас установлена " + d.current + "." : "";
      document.getElementById("hint").textContent = d.footer || "";
      const box = document.getElementById("notes");
      // «Что нового» — абзацы и пункты «• …» / «- …»; блоки версий — «0.1.56:».
      let ul = null;
      for (const raw of String(d.notes || "").split("\n")) {
        const line = raw.trim();
        if (!line) { ul = null; continue; }
        if (/^\d+\.\d+\.\d+:?$/.test(line)) {
          const h = document.createElement("h2");
          h.textContent = "Версия " + line.replace(/:$/, "");
          box.append(h);
          ul = null;
          continue;
        }
        if (!ul) { ul = document.createElement("ul"); box.append(ul); }
        const li = document.createElement("li");
        li.textContent = line.replace(/^[•\-*]\s*/, "");
        ul.append(li);
      }
      if (!box.children.length) box.style.display = "none";
      const btns = document.getElementById("btns");
      (d.buttons || ["Понятно"]).forEach((b, i) => {
        const a = document.createElement("a");
        a.className = "btn" + (i === 0 ? " main" : "");
        a.href = "#answer-" + i;
        a.textContent = b;
        btns.append(a);
      });
      btns.querySelector("a")?.focus();
    </script>
  </body>
</html>
