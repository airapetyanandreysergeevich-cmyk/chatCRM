services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # Приложение работает под обычной ролью — только под ней действует RLS.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Миграции накатываются под владельцем схемы и только на старте контейнера.
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      # Распознаватель шильдиков. Без него сайт работает как раньше, просто
      # без кнопки камеры на бланке, — поэтому и depends_on на него нет.
      OCR_URL: http://ocr:8000

  # Распознавание шильдиков: RapidOCR + zxing-cpp, только процессор.
  # Порт наружу не публикуется — к сервису ходит только backend. Одно ядро и
  # потолок памяти: распознавание не должно отнимать сервер у сайта и базы.
  ocr:
    build: ./ocr
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 900m
    environment:
      OMP_NUM_THREADS: "1"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/templates-src:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/downloads:/srv/downloads:ro
      - nginx-conf:/etc/nginx/conf.d
    # Скрипт запускаем через sh, а не напрямую: проект редактируется в том числе
    # на Windows, где признак «исполняемый» не сохраняется, и файл приезжает с правами 644.
    command: >
      sh -c "sh /etc/nginx/templates-src/render-config.sh && nginx -g 'daemon off;'"
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES}
      HTTPS_ENABLED: ${HTTPS_ENABLED}

volumes:
  postgres-data:
  minio-data:
  nginx-conf:
