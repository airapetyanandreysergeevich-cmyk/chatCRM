server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # APK отдаём своим типом и без подмены на страницу сайта.
    # Тип объявляем явно: в стандартном списке nginx расширения .apk нет,
    # и без этого Android дописывает к имени .html и файл не ставится.
    location ~ \.apk$ {
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
    }

    # Файл связи сайта с андроид-приложением. Если его нет, нужна честная
    # 404: получив вместо него страницу сайта, Android молча решает, что
    # связь не подтверждена, и показывает адресную строку поверх приложения.
    location /.well-known/ {
        try_files $uri =404;
    }

    # Распознаватель шильдиков: модели и движок для телефона или компьютера
    # сотрудника. Файлы большие (16 МБ) и меняются только с обновлением —
    # пусть лежат в кэше браузера. Типы объявляем сами: .mjs движок грузит
    # как модуль, и с чужим типом браузер его не выполнит. Отсутствующий
    # файл — честная 404, а не страница сайта вместо модели.
    location /ocr-models/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
            application/octet-stream onnx;
            text/plain txt;
        }
        # Сжатие: движок .wasm ужимается в три раза — это секунды на
        # мобильном интернете при первом снимке.
        # gzip_http_version 1.0: внешний nginx ходит сюда по HTTP/1.0, и без
        # этой строки сжатие молча не включалось бы.
        gzip on;
        gzip_http_version 1.0;
        gzip_types application/wasm application/javascript application/octet-stream text/plain;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Всё остальное — одностраничное приложение: любой адрес отдаёт index.html,
    # маршрут разбирает уже сам интерфейс.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
