<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale и user-scalable: случайное «растягивание» двумя пальцами
         сбивало вёрстку и уводило нижнее меню за край экрана, а вернуть масштаб
         обратно человек не догадывался. viewport-fit=cover нужен, чтобы
         страница знала про вырез и часы — отступы под них берутся из env(). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F2430" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="FineCRM" />
    <!-- iOS не читает манифест: имя, полноэкранный режим и цвет статус-бара
         задаются только этими метками. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FineCRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>FineCRM — CRM для мастерских</title>

    <!--
      Цвета из прошлого сеанса применяем до первой отрисовки. Иначе экран
      успевает моргнуть тёмным по пути к светлой теме — и наоборот. Скрипт
      намеренно крошечный и без зависимостей: всё, что он делает, — достаёт
      готовый набор переменных из localStorage и кладёт его на <html>.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("theme:mode");
          if (mode !== "light" && mode !== "dark") mode = "dark";
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;

          var raw = localStorage.getItem("theme:tokens");
          if (!raw) return;
          var tokens = JSON.parse(raw);
          for (var name in tokens) {
            if (name.indexOf("--") === 0) document.documentElement.style.setProperty(name, tokens[name]);
          }
        } catch (e) {
          /* нет localStorage или мусор в нём — останутся цвета из файла стилей */
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <!--
      Safari на iPhone метку user-scalable не слушает — увеличение двумя
      пальцами он считает правом пользователя и отменить его можно только так.
      Отменяем только жест масштабирования: прокрутка, касания и выделение
      текста работают как работали.
    -->
    <script>
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
